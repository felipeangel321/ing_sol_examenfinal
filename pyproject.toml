[project]
name = "proyecto-seguros"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.0",
    "langchain-groq>=1.1.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pymupdf>=1.26.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.0",
    # Declarado aquí solo para elegir de dónde se instala (ver [tool.uv.sources]).
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
]

# En Linux (el servidor), torch se instala en versión CPU: la de PyPI trae CUDA y
# pesa varios GB que una EC2 sin GPU no usa. En Windows y macOS no cambia nada.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
# Solo las pruebas del proyecto (no la copia que arma el notebook en entrega/).
testpaths = ["tests"]
